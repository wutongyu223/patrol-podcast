<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#234e49">
  <meta name="description" content="巡检84问知识直讲：按题定位音频，对照文字稿，保存进度与离线收听。">
  <title>巡检84问 · 知识直讲</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#reader">跳至文字稿</a>
  <header class="masthead">
    <a class="brand" href="#q=1" aria-label="巡检84问首页"><img src="assets/icon.svg" width="35" height="35" alt=""><span>巡检84问<small>设备原理与系统流程</small></span></a>
    <div class="edition"><span class="dot"></span>知识直讲版 <span class="divider">/</span> 12个系统 · 84个知识点</div>
    <button id="menu-toggle" class="mobile-only quiet" aria-expanded="false" aria-controls="directory">题目目录</button>
  </header>
  <main class="layout">
    <aside id="directory" class="directory" aria-label="题目目录">
      <div class="directory-head"><h2>收听目录</h2><span id="result-count">84题</span></div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="题号、设备或知识点" autocomplete="off" aria-label="搜索题号、标题和文字稿"></label>
      <select id="chapter-filter" aria-label="按系统筛选"><option value="all">全部12个系统</option></select>
      <div class="filters"><button id="filter-all" class="pill selected" aria-pressed="true">全部题目</button><button id="filter-saved" class="pill" aria-pressed="false">已收藏 <span id="saved-count">0</span></button></div>
      <nav id="question-list" aria-label="知识点列表"><p class="muted">正在载入目录…</p></nav>
      <p class="directory-foot">点击题目，从对应录音开始播放并查看文字稿。</p>
    </aside>
    <section class="main-column">
      <div id="resume-banner" class="resume-banner" hidden><span id="resume-text"></span><button id="resume">继续收听 →</button></div>
      <div class="overview"><span>10.15 巡检笔记</span><span id="duration-label">知识直讲</span></div>
      <article id="reader" tabindex="-1">
        <div class="article-meta"><span id="chapter-label">加载中</span><span id="question-number">Q001 / 084</span></div>
        <h1 id="question-title">巡检84问</h1>
        <p id="question-key" class="key"></p>
        <div class="article-tools"><button id="play-question" class="primary">▶ 播放本题</button><button id="bookmark" aria-pressed="false">☆ 收藏本题</button><button id="copy-link">复制本题链接</button><span id="question-duration" class="muted"></span></div>
        <div id="transcript" class="transcript"><p>正在载入文字稿…</p></div>
        <div class="article-nav"><button id="previous">← 上一题</button><button id="next">下一题 →</button></div>
      </article>
      <section class="save-panel" aria-labelledby="save-heading">
        <div><h2 id="save-heading">把这份讲解留下来</h2><p>音频和文字稿可下载；离线保存后，可在此浏览器断网收听。</p></div>
        <div class="save-actions"><button id="offline">保存离线音频 · 44.3 MB</button><a id="download-audio" class="button" href="#" download="巡检84问_知识直讲版.mp3">下载音频</a><a class="button" href="transcript.txt" download="巡检84问_知识直讲稿.txt">下载文字稿</a></div>
        <div class="backup-actions"><button id="export-progress" class="text-button">导出进度与收藏</button><button id="import-progress" class="text-button">导入备份</button><input id="import-file" type="file" accept="application/json,.json" hidden></div>
        <p id="storage-note" class="small">进度和收藏保存在当前浏览器。换设备需导出、导入备份；清理浏览器数据会清除本地记录。</p>
      </section>
      <footer>依据既有规程、系统图查证稿整理。现场待核项保留在对应正文中。<br>2026.10.17 · 知识直讲版</footer>
    </section>
  </main>
  <section class="player" aria-label="音频播放器">
    <div class="player-inner">
      <div class="transport"><button id="rewind" class="round" aria-label="后退15秒">−15</button><button id="play" class="play" aria-label="播放">▶</button><button id="forward" class="round" aria-label="前进15秒">+15</button></div>
      <div class="player-middle"><button id="now-playing" class="now-playing" title="查看正在收听的文字稿">准备收听</button><div class="seek-row"><span id="current-time">00:00</span><input id="seek" type="range" min="0" max="1" value="0" step="0.1" aria-label="播放进度"><span id="total-time">00:00</span></div></div>
      <label class="speed-label"><span class="small">倍速</span><select id="speed" aria-label="播放速度"><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label>
      <span id="progress-saved" class="progress-saved">进度自动保存</span>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <noscript><p>此页面需要JavaScript进行题目定位与进度保存。可直接<a href="transcript.txt">阅读文字稿</a>。</p></noscript>
</body>
</html>
